<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>Product - Electric Emporium</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E30613;--black:#1C1C1C;--black2:#111;--white:#fff;--off:#F7F7F7;--gray:#777;--border:#E0E0E0}
body{font-family:Montserrat,sans-serif;background:var(--off);color:var(--black)}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;height:70px;background:var(--white);border-bottom:3px solid var(--red);box-shadow:0 2px 14px rgba(0,0,0,0.07)}
.nav-logo{display:flex;align-items:center;gap:0.6rem;text-decoration:none}
.nav-logo img{height:40px;width:auto;object-fit:contain}
.logo-text{font-size:1.15rem;font-weight:800;line-height:1}
.logo-text .e{color:var(--red)}.logo-text .em{color:var(--black)}
.nav-back{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:color 0.2s}
.nav-back:hover{color:var(--red)}
.nav-cta{background:var(--red);color:var(--white);border:none;padding:0.58rem 1.3rem;font-family:Montserrat,sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:2.5rem 2rem}
.breadcrumb{font-size:0.65rem;color:var(--gray);margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem}
.breadcrumb a{color:var(--gray);text-decoration:none}.breadcrumb a:hover{color:var(--red)}
.breadcrumb span{color:var(--black);font-weight:600}
.product-wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;background:var(--white);padding:2.5rem;border:1px solid var(--border)}
/* GALLERY */
.gallery{display:flex;flex-direction:column;gap:12px}
.main-img-wrap{position:relative;aspect-ratio:1;background:var(--off);border:1px solid var(--border);overflow:hidden;cursor:zoom-in}
.main-img-wrap img{width:100%;height:100%;object-fit:contain;transition:transform 0.3s}
.main-img-wrap:hover img{transform:scale(1.05)}
.main-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:0.2}
.thumbnails{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:68px;height:68px;border:2px solid var(--border);cursor:pointer;overflow:hidden;background:var(--off);transition:border-color 0.2s;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.active{border-color:var(--red)}
/* PRODUCT INFO */
.product-info{display:flex;flex-direction:column;gap:1rem}
.pi-brand{font-size:0.65rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--red)}
.pi-name{font-size:1.6rem;font-weight:900;color:var(--black);line-height:1.15;letter-spacing:-0.5px}
.pi-cat{font-size:0.68rem;color:var(--gray);font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
.pi-divider{height:1px;background:var(--border)}
.pi-price{font-size:1.8rem;font-weight:900;color:var(--black);letter-spacing:-0.5px}
.pi-price .rupee{font-size:1.2rem}
.pi-spec{font-size:0.82rem;color:#555;line-height:1.8;font-weight:300}
.variants-section{display:flex;flex-direction:column;gap:12px}
.variant-group-label{font-size:0.65rem;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
.variant-options{display:flex;flex-wrap:wrap;gap:8px}
.variant-btn{padding:8px 16px;border:1.5px solid var(--border);background:var(--white);font-family:Montserrat,sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;letter-spacing:0.05em}
.variant-btn:hover{border-color:var(--black)}
.variant-btn.active{border-color:var(--red);background:var(--red);color:var(--white)}
.variant-btn.out{opacity:0.4;cursor:not-allowed;text-decoration:line-through}
.stock-status{display:inline-flex;align-items:center;gap:6px;font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.stock-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stock-in .stock-dot{background:#2e7d32}.stock-in{color:#2e7d32}
.stock-out .stock-dot{background:#c62828}.stock-out{color:#c62828}
.btn-enquire{width:100%;padding:1.1rem;background:var(--black);color:var(--white);border:none;font-family:Montserrat,sans-serif;font-size:0.8rem;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-enquire:hover{background:var(--red)}
.btn-call{width:100%;padding:1rem;background:var(--white);color:var(--black);border:2px solid var(--black);font-family:Montserrat,sans-serif;font-size:0.8rem;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn-call:hover{background:var(--black);color:var(--white)}
.trust-row{display:flex;gap:1rem;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:6px;font-size:0.65rem;color:var(--gray);font-weight:600}
/* LIGHTBOX */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:999;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain}
#lightbox-close{position:absolute;top:1.5rem;right:2rem;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none;line-height:1}
.loading-wrap{padding:4rem;text-align:center;color:var(--gray);font-size:0.9rem;font-weight:600}
#waFloat{position:fixed;bottom:2rem;right:2rem;z-index:99;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.45);text-decoration:none;animation:wp 2.5s infinite}
@keyframes wp{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,0.45)}50%{box-shadow:0 4px 32px rgba(37,211,102,0.75),0 0 0 8px rgba(37,211,102,0.1)}}
footer{background:var(--black2);padding:1.8rem 3rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;border-top:3px solid var(--red);margin-top:3rem}
.fw{font-size:0.95rem;font-weight:900}.fw .e{color:var(--red)}.fw .em{color:#fff}
.fc{font-size:0.68rem;color:rgba(255,255,255,0.28);text-align:center}
@media(max-width:800px){
  nav{padding:0 1.2rem}
  .product-wrap{grid-template-columns:1fr;gap:2rem;padding:1.5rem}
  .wrap{padding:1.5rem 1rem}
  footer{flex-direction:column;text-align:center;padding:1.5rem}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="eng_HD_jpeg.jpg" alt="Electric Emporium">
    <div>
      <div class="logo-text"><span class="e">Electric</span><span class="em"> Emporium</span></div>
      <div style="font-size:0.56rem;font-weight:700;letter-spacing:0.18em;color:var(--gray);text-transform:uppercase;margin-top:1px">Est. 1989 &middot; Balaghat</div>
    </div>
  </a>
  <a class="nav-back" href="products.html">&larr; Back to Products</a>
  <button class="nav-cta" id="enquireNavBtn">Enquire Now</button>
</nav>

<div class="wrap">
  <div class="breadcrumb">
    <a href="index.html">Home</a> &rsaquo;
    <a href="products.html">Products</a> &rsaquo;
    <span id="bc-cat"></span>
  </div>

  <div id="product-container"><div class="loading-wrap">Loading product...</div></div>
</div>

<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<a href="https://wa.me/919425831035" target="_blank" id="waFloat">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<footer>
  <div class="fw"><span class="e">Electric </span><span class="em">Emporium</span></div>
  <div class="fc">&copy; 2026 Electric Emporium &middot; Gujri Chowk, Balaghat &middot; Est. 1989</div>
  <a href="products.html" style="font-size:0.64rem;font-weight:700;color:rgba(255,255,255,0.32);text-decoration:none;letter-spacing:0.12em;text-transform:uppercase">&larr; All Products</a>
</footer>

<script>
var SURL = "https://dnmzzckeuctnkqbphwdg.supabase.co";
var SKEY = "sb_publishable_TkuJuy1AF1wixYRIPCh2WA_U8A-Pxn3";
var PHONE = "919425831035";
var product = null;
var images  = [];
var variants = [];
var selectedVariants = {};
var currentImageIndex = 0;

function openWA(msg) { window.open("https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg), "_blank"); }

function getParam(name) {
  var href = window.location.href;
  var idx = href.indexOf("?");
  if (idx === -1) return "";
  var pairs = href.substring(idx+1).split("&");
  for (var i=0; i<pairs.length; i++) {
    var eq = pairs[i].indexOf("=");
    if (eq === -1) continue;
    if (decodeURIComponent(pairs[i].substring(0,eq)) === name)
      return decodeURIComponent(pairs[i].substring(eq+1));
  }
  return "";
}

async function loadProduct() {
  var id = getParam("id");
  if (!id) { document.getElementById("product-container").innerHTML = "<div class='loading-wrap'>Product not found.</div>"; return; }

  var headers = { "apikey": SKEY, "Authorization": "Bearer " + SKEY };

  var pRes = await fetch(SURL + "/rest/v1/products?id=eq." + id + "&select=*", { headers: headers });
  var pData = await pRes.json();
  if (!pData.length) { document.getElementById("product-container").innerHTML = "<div class='loading-wrap'>Product not found.</div>"; return; }
  product = pData[0];

  var iRes = await fetch(SURL + "/rest/v1/product_images?product_id=eq." + id + "&order=sort_order.asc", { headers: headers });
  images = await iRes.json();

  var vRes = await fetch(SURL + "/rest/v1/product_variants?product_id=eq." + id, { headers: headers });
  variants = await vRes.json();

  document.title = (product.Name || "Product") + " - Electric Emporium";
  document.getElementById("bc-cat").textContent = product.Category || "";

  renderProduct();
}

function renderProduct() {
  var allImages = images.length > 0 ? images : (product.Photo_url ? [{image_url: product.Photo_url}] : []);

  /* gallery */
  var galleryHtml = "<div class='gallery'>";
  galleryHtml += "<div class='main-img-wrap' onclick='openLightbox(0)' id='main-img-wrap'>";
  if (allImages.length > 0) {
    galleryHtml += "<img id='main-img' src='" + allImages[0].image_url + "' alt='" + (product.Name||"") + "'>";
  } else {
    galleryHtml += "<div class='main-img-placeholder'>&#128247;</div>";
  }
  galleryHtml += "</div>";
  if (allImages.length > 1) {
    galleryHtml += "<div class='thumbnails'>";
    allImages.forEach(function(img, idx) {
      galleryHtml += "<div class='thumb" + (idx===0?" active":"") + "' onclick='setImage(" + idx + ")' id='thumb-" + idx + "'><img src='" + img.image_url + "' alt=''></div>";
    });
    galleryHtml += "</div>";
  }
  galleryHtml += "</div>";

  /* variants */
  var variantGroups = {};
  variants.forEach(function(v) {
    if (!variantGroups[v.variant_type]) variantGroups[v.variant_type] = [];
    variantGroups[v.variant_type].push(v);
  });

  var variantsHtml = "";
  if (Object.keys(variantGroups).length > 0) {
    variantsHtml = "<div class='variants-section'>";
    Object.keys(variantGroups).forEach(function(type) {
      variantsHtml += "<div><div class='variant-group-label'>" + type.charAt(0).toUpperCase() + type.slice(1) + "</div><div class='variant-options'>";
      variantGroups[type].forEach(function(v) {
        var cls = "variant-btn" + (!v.in_stock ? " out" : "");
        variantsHtml += "<button class='" + cls + "' data-type='" + type + "' data-value='" + v.variant_value + "' data-price='" + (v.price||"") + "' data-stock='" + v.in_stock + "' onclick='selectVariant(this)'>" + v.variant_value + "</button>";
      });
      variantsHtml += "</div></div>";
    });
    variantsHtml += "</div>";
  }

  var priceHtml = product.Price ? "<div class='pi-price'>" + product.Price + "</div>" : "";
  var stockHtml = product.in_stock
    ? "<span class='stock-status stock-in'><span class='stock-dot'></span> In Stock</span>"
    : "<span class='stock-status stock-out'><span class='stock-dot'></span> Out of Stock</span>";

  var html = "<div class='product-wrap'>" +
    galleryHtml +
    "<div class='product-info'>" +
      "<div class='pi-brand'>" + (product.Brand||"") + "</div>" +
      "<div class='pi-name'>" + (product.Name||"") + "</div>" +
      "<div class='pi-cat'>" + (product.Category||"") + "</div>" +
      "<div class='pi-divider'></div>" +
      "<div id='current-price'>" + priceHtml + "</div>" +
      (product.Spec ? "<div class='pi-spec'>" + (product.Spec||"").replace(/
/g,"<br>") + "</div>" : "") +
      "<div id='stock-status'>" + stockHtml + "</div>" +
      variantsHtml +
      "<div class='pi-divider'></div>" +
      "<button class='btn-enquire' id='enquireBtn'><svg width='18' height='18' viewBox='0 0 24 24' fill='white'><path d='M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z'/></svg> Enquire on WhatsApp</button>" +
      "<a class='btn-call' href='tel:+919425831035'>&#128222; Call +91 94258 31035</a>" +
      "<div class='trust-row'><div class='trust-item'>&#10003; Genuine product</div><div class='trust-item'>&#10003; ISI certified brands</div><div class='trust-item'>&#10003; Est. 1989</div></div>" +
    "</div>" +
  "</div>";

  document.getElementById("product-container").innerHTML = html;

  document.getElementById("enquireBtn").addEventListener("click", sendEnquiry);
  document.getElementById("enquireNavBtn").addEventListener("click", sendEnquiry);
}

function setImage(idx) {
  var allImages = images.length > 0 ? images : (product.Photo_url ? [{image_url: product.Photo_url}] : []);
  currentImageIndex = idx;
  var mainImg = document.getElementById("main-img");
  if (mainImg) mainImg.src = allImages[idx].image_url;
  document.querySelectorAll(".thumb").forEach(function(t, i) { t.classList.toggle("active", i===idx); });
}

function selectVariant(btn) {
  if (btn.classList.contains("out")) return;
  var type  = btn.getAttribute("data-type");
  var value = btn.getAttribute("data-value");
  var price = btn.getAttribute("data-price");
  var stock = btn.getAttribute("data-stock") === "true";

  document.querySelectorAll(".variant-btn[data-type='" + type + "']").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  selectedVariants[type] = { value: value, price: price, in_stock: stock };

  if (price) {
    var priceEl = document.getElementById("current-price");
    if (priceEl) priceEl.innerHTML = "<div class='pi-price'>" + price + "</div>";
  }
}

function sendEnquiry() {
  var msg = "Hello Electric Emporium! I am interested in " + (product.Name||"") + " by " + (product.Brand||"") + ".";
  var variantParts = [];
  Object.keys(selectedVariants).forEach(function(type) { variantParts.push(type + ": " + selectedVariants[type].value); });
  if (variantParts.length) msg += " Selected: " + variantParts.join(", ") + ".";
  var priceEl = document.querySelector(".pi-price");
  if (priceEl) msg += " Price: " + priceEl.textContent + ".";
  msg += " Please confirm availability. Thank you!";
  openWA(msg);
}

function openLightbox(idx) {
  var allImages = images.length > 0 ? images : (product.Photo_url ? [{image_url: product.Photo_url}] : []);
  if (!allImages.length) return;
  document.getElementById("lightbox-img").src = allImages[idx].image_url;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() { document.getElementById("lightbox").classList.remove("open"); }
document.addEventListener("keydown", function(e) { if(e.key==="Escape") closeLightbox(); });

loadProduct();
</script>
</body>
</html>
