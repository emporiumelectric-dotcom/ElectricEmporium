name: Build product pages and sitemap

on:
  schedule:
    - cron: '17 21 * * *'   # daily 21:17 UTC (~02:47 IST), so new products get a page within a day
  push:
    branches: [main]
    paths:
      - product-detail.html
      - generate_product_pages.py
      - generate_sitemap.py
  workflow_dispatch: {}    # run manually from the Actions tab after a big catalogue change

concurrency:
  group: build-product-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate product pages
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python generate_product_pages.py

      - name: Generate sitemap
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python generate_sitemap.py

      - name: Commit if changed
        run: |
          git config user.name "sitemap-bot"
          git config user.email "actions@github.com"
          git add -A products sitemap.xml
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: rebuild product pages and sitemap"
          git push
