<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E30613;--red2:#FF1F2D;--black:#1C1C1C;--black2:#111;--white:#fff;--off:#F7F7F7;--gray:#777;--border:#E0E0E0}
html,body{overflow-x:hidden}
body{font-family:Montserrat,sans-serif;background:var(--white);color:var(--black)}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;height:70px;background:var(--white);border-bottom:3px solid var(--red);box-shadow:0 2px 14px rgba(0,0,0,0.07)}
.nav-logo{display:flex;align-items:center;gap:0.6rem;text-decoration:none}
.nav-logo img{height:40px;width:auto;object-fit:contain}
.logo-text{font-size:1.15rem;font-weight:800;line-height:1}
.logo-text .e{color:var(--red)}.logo-text .em{color:var(--black)}
.nav-back{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);text-decoration:none}
.nav-back:hover{color:var(--red)}
.nav-cta{background:var(--red);color:var(--white);border:none;padding:0.58rem 1.3rem;font-family:Montserrat,sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer}
.page-wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}
.sidebar{background:var(--black2);padding:1.5rem 0;position:sticky;top:70px;height:calc(100vh - 70px);overflow-y:auto}
.sb-label{font-size:0.58rem;font-weight:800;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.25);padding:0 1.2rem;margin-bottom:0.6rem;display:block;margin-top:0.5rem}
.sb-btn{display:block;width:100%;padding:0.65rem 1.2rem;font-family:Montserrat,sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.5);background:none;border:none;border-left:3px solid transparent;cursor:pointer;text-align:left;transition:all 0.15s}
.sb-btn:hover{color:#fff;background:rgba(255,255,255,0.05)}
.sb-btn.active{color:#fff;background:rgba(227,6,19,0.18);border-left-color:var(--red)}
.sb-div{height:1px;background:rgba(255,255,255,0.06);margin:0.8rem 1.2rem}
.main{display:flex;flex-direction:column}
.main-top{padding:1.4rem 2rem 1rem;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:70px;z-index:9}
.main-title{font-size:1.1rem;font-weight:900;text-transform:uppercase;letter-spacing:-0.3px;color:var(--black)}
.main-title em{color:var(--red);font-style:normal}
.main-count{font-size:0.68rem;color:var(--gray);font-weight:600;margin-top:2px}
.brand-bar{padding:0.7rem 2rem;display:flex;gap:6px;flex-wrap:wrap;background:var(--white);border-bottom:1px solid var(--off)}
.bpill{padding:4px 12px;font-size:0.6rem;font-weight:700;font-family:Montserrat,sans-serif;border:1.5px solid var(--border);cursor:pointer;background:var(--white);color:var(--gray);letter-spacing:0.08em;text-transform:uppercase;transition:all 0.15s}
.bpill.active{background:var(--black);color:var(--white);border-color:var(--black)}
.bpill:hover{border-color:#888;color:var(--black)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--border)}
.pcard{background:var(--white);display:flex;flex-direction:column;cursor:pointer;text-decoration:none;transition:box-shadow 0.2s}
.pcard:hover{box-shadow:0 4px 20px rgba(0,0,0,0.12);z-index:1;position:relative}
.pimg{height:160px;background:var(--off);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);overflow:hidden;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
.pcard:hover .pimg img{transform:scale(1.04)}
.pimg-ph{font-size:3.5rem;opacity:0.2}
.out-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;font-size:0.55rem;font-weight:800;padding:3px 8px;letter-spacing:0.1em;text-transform:uppercase}
.pbody{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.pbrand{font-size:0.56rem;color:var(--red);font-weight:800;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:4px}
.pname{font-size:0.8rem;font-weight:800;color:var(--black);line-height:1.25;margin-bottom:3px;flex:1;text-transform:uppercase;letter-spacing:0.02em}
.pspec{font-size:0.62rem;color:#bbb;margin-bottom:4px}
.pprice{font-size:0.78rem;font-weight:900;color:var(--black);margin-bottom:8px}
.pview{width:100%;background:var(--black);color:var(--white);font-family:Montserrat,sans-serif;font-size:0.6rem;font-weight:800;padding:9px;border:none;display:flex;align-items:center;justify-content:center;gap:4px;letter-spacing:0.1em;text-transform:uppercase;transition:background 0.2s}
.pcard:hover .pview{background:var(--red)}
.loading-state,.empty-state{padding:4rem 2rem;text-align:center;grid-column:1/-1;background:var(--white)}
.loading-state p,.empty-state p{font-size:0.9rem;color:var(--gray);font-weight:600}
#waFloat{position:fixed;bottom:2rem;right:2rem;z-index:999;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.45);text-decoration:none;animation:wp 2.5s infinite}
@keyframes wp{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,0.45)}50%{box-shadow:0 4px 32px rgba(37,211,102,0.75),0 0 0 8px rgba(37,211,102,0.1)}}
footer{background:var(--black2);padding:1.8rem 3rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;border-top:3px solid var(--red)}
.fw{font-size:0.95rem;font-weight:900}.fw .e{color:var(--red)}.fw .em{color:#fff}
.fc{font-size:0.68rem;color:rgba(255,255,255,0.28);text-align:center}.fc span{color:var(--red)}
@media(max-width:800px){
  nav{padding:0 1.2rem}
  .page-wrap{grid-template-columns:1fr}
  .sidebar{display:flex;overflow-x:auto;overflow-y:visible;height:auto;position:static;padding:0.6rem;gap:4px;border-bottom:2px solid var(--red)}
  .sb-label{display:none}
  .sb-btn{white-space:nowrap;padding:5px 12px;border:1.5px solid rgba(255,255,255,0.15);border-left:1.5px solid rgba(255,255,255,0.15);font-size:0.6rem}
  .sb-btn.active{border-color:var(--red)}
  .sb-div{display:none}
  .main-top{position:static}
  footer{flex-direction:column;text-align:center;padding:1.5rem}
}

<script>
var SURL = "https://dnmzzckeuctnkqbphwdg.supabase.co";
var SKEY = "sb_publishable_TkuJuy1AF1wixYRIPCh2WA_U8A-Pxn3";
var PHONE = "919425831035";
var allProducts = [];
var activeCat = "All";
var activeBrand = "All";
function openWA(msg) { window.open("https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg), "_blank"); }
document.getElementById("enquireBtn").addEventListener("click", function() { openWA("Hello Electric Emporium! I would like to enquire about your products."); });
function makeEl(tag, cls, text) {
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
async function fetchProducts() {
  try {
    var res = await fetch(SURL + "/rest/v1/products?select=*&order=id.asc", {
      headers: { "apikey": SKEY, "Authorization": "Bearer " + SKEY }
    });
    if (!res.ok) throw new Error("Failed");
    allProducts = await res.json();
    render();
  } catch(e) {
    document.getElementById("pgrid").innerHTML = "<div class='empty-state'><p>Could not load products. Please try again.</p></div>";
  }
}
function getCats() { var s={},r=[]; allProducts.forEach(function(p){if(p.Category&&!s[p.Category]){s[p.Category]=1;r.push(p.Category);}}); return r.sort(); }
function getBrands() {
  var s={},r=[];
  var f = activeCat==="All" ? allProducts : allProducts.filter(function(p){return p.Category===activeCat;});
  f.forEach(function(p){if(p.Brand&&!s[p.Brand]){s[p.Brand]=1;r.push(p.Brand);}}); return r.sort();
}
function buildSidebar() {
  var sb = document.getElementById("sidebar"); sb.innerHTML = "";
  sb.appendChild(makeEl("span","sb-label","Categories"));
  var ab = makeEl("button","sb-btn"+(activeCat==="All"?" active":""),"All Categories");
  ab.addEventListener("click",function(){setCat("All");});sb.appendChild(ab);
  getCats().forEach(function(c){
    var b=makeEl("button","sb-btn"+(activeCat===c?" active":""),c);
    b.addEventListener("click",function(){setCat(c);});sb.appendChild(b);
  });
  sb.appendChild(makeEl("div","sb-div"));
  sb.appendChild(makeEl("span","sb-label","Brands"));
  var abb=makeEl("button","sb-btn"+(activeBrand==="All"?" active":""),"All Brands");
  abb.addEventListener("click",function(){setBrand("All");});sb.appendChild(abb);
  getBrands().forEach(function(b){
    var btn=makeEl("button","sb-btn"+(activeBrand===b?" active":""),b);
    btn.addEventListener("click",function(){setBrand(b);});sb.appendChild(btn);
  });
}
function buildBrandBar() {
  var bar=document.getElementById("brand-bar"); bar.innerHTML="";
  var ab=makeEl("button","bpill"+(activeBrand==="All"?" active":""),"All");
  ab.addEventListener("click",function(){setBrand("All");});bar.appendChild(ab);
  getBrands().forEach(function(b){
    var btn=makeEl("button","bpill"+(activeBrand===b?" active":""),b);
    btn.addEventListener("click",function(){setBrand(b);});bar.appendChild(btn);
  });
}
function buildGrid() {
  var grid=document.getElementById("pgrid"); grid.innerHTML="";
  var filtered=allProducts.filter(function(p){
    return (activeCat==="All"||p.Category===activeCat)&&(activeBrand==="All"||p.Brand===activeBrand);
  });
  var title=document.getElementById("main-title");
  title.textContent = activeCat==="All" ? "All Products" : activeCat;
  if(activeBrand!=="All"){var em=document.createElement("em");em.textContent=" / "+activeBrand;title.appendChild(em);}
  document.getElementById("main-count").textContent=filtered.length+" product"+(filtered.length!==1?"s":"");
  if(!filtered.length){
    var e=makeEl("div","empty-state"); e.appendChild(makeEl("p","","No products found.")); grid.appendChild(e); return;
  }
  filtered.forEach(function(p){
    var card=document.createElement("a");
    card.className="pcard";
    card.href="product-detail.html?id="+p.id;
    var imgDiv=makeEl("div","pimg");
    if(p.Photo_url){
      var img=document.createElement("img"); img.src=p.Photo_url; img.alt=p.Name||""; img.loading="lazy"; imgDiv.appendChild(img);
    }else{imgDiv.appendChild(makeEl("div","pimg-ph","📷"));}
    if(!p.in_stock){imgDiv.appendChild(makeEl("div","out-badge","Out of Stock"));}
    var body=makeEl("div","pbody");
    body.appendChild(makeEl("div","pbrand",p.Brand||""));
    body.appendChild(makeEl("div","pname",p.Name||""));
    if(p.Spec)body.appendChild(makeEl("div","pspec",(p.Spec||"").substring(0,60)));
    var priceText=p.Price?((p.Price.startsWith('₹')||p.Price.startsWith('Rs'))?'':'₹')+p.Price:'Call for Price';
    body.appendChild(makeEl("div","pprice",priceText));
    var viewBtn=makeEl("div","pview","View Product →");
    body.appendChild(viewBtn);
    card.appendChild(imgDiv); card.appendChild(body); grid.appendChild(card);
  });
}
function render(){buildSidebar();buildBrandBar();buildGrid();}
function setCat(k){activeCat=k;activeBrand="All";render();window.scrollTo(0,0);}
function setBrand(b){activeBrand=b;render();}
function getParam(name) {
  var href=window.location.href; var idx=href.indexOf("?"); if(idx===-1)return "";
  var pairs=href.substring(idx+1).split("&");
  for(var i=0;i<pairs.length;i++){var eq=pairs[i].indexOf("=");if(eq===-1)continue;if(decodeURIComponent(pairs[i].substring(0,eq))===name)return decodeURIComponent(pairs[i].substring(eq+1));}
  return "";
}
var pc=getParam("category"),pb=getParam("brand");
if(pb)activeBrand=pb; else if(pc)activeCat=pc;
fetchProducts();
</script>
